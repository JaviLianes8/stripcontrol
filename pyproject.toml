[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "stripcontrol"
version = "1.0.0"
description = "Remove or detect control characters and terminal escape sequences in text, logs and streams"
readme = "README.md"
requires-python = ">=3.10"
license = "MIT"
license-files = ["LICENSE"]
authors = [{ name = "Javier Lianes", email = "javier@lianes8studio.com" }]
keywords = [
    "control-characters",
    "ansi",
    "escape-sequences",
    "ecma-48",
    "terminal",
    "sanitize",
    "logs",
    "unicode",
]
classifiers = [
    "Development Status :: 5 - Production/Stable",
    "Intended Audience :: Developers",
    "Environment :: Console",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3 :: Only",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Python :: 3.14",
    "Topic :: Security",
    "Topic :: Terminals",
    "Topic :: Text Processing :: Filters",
    "Typing :: Typed",
]
dependencies = []

[project.optional-dependencies]
dev = ["ruff", "mypy", "pytest", "pytest-timeout", "build", "twine"]

[project.scripts]
stripcontrol = "stripcontrol._cli:main"

[project.urls]
Homepage = "https://lianes8studio.com"
Repository = "https://github.com/JaviLianes8/stripcontrol"
Source = "https://github.com/JaviLianes8/stripcontrol"
Issues = "https://github.com/JaviLianes8/stripcontrol/issues"
Changelog = "https://github.com/JaviLianes8/stripcontrol/blob/main/CHANGELOG.md"
LinkedIn = "https://www.linkedin.com/in/jlianes/"
Funding = "https://buymeacoffee.com/jlianesglrs"

[tool.hatch.build.targets.sdist]
# Third-party test files are fetched locally and never shipped; only their manifest is.
include = ["/src", "/tests", "/scripts/fetch_upstream.py", "/scripts/gen_format_table.py", "/README.md", "/GUIDE.md", "/CHANGELOG.md", "/LICENSE", "/pyproject.toml"]
exclude = ["tests/upstream/*", "**/__pycache__", "**/*.pyc"]
artifacts = ["tests/upstream/MANIFEST.json"]

[tool.hatch.build.targets.wheel]
packages = ["src/stripcontrol"]

[tool.ruff]
line-length = 100
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM", "RUF"]

[tool.mypy]
python_version = "3.10"
strict = true
mypy_path = "scripts"

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
addopts = "-q"
timeout = 300
required_plugins = ["pytest-timeout"]
